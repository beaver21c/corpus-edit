name: integrity
# 이 저장소의 파일은 원본 코퍼스에서 자동 생성된다. 여기서 손으로 고치면 여기서 걸린다.
# 그리고 확인낱말이 샤드 밖으로 새지 않았는지 본다 — 새면 "읽었는지" 검증이 무의미해진다.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 샤드가 manifest 와 일치하는가
        run: |
          python3 - <<'PY'
          import json, hashlib, io, sys
          m = json.load(io.open('manifest.json', encoding='utf-8'))
          bad = []
          for r in m['모델이_읽는_규칙']:
              t = io.open(r['파일'], encoding='utf-8').read()
              h = hashlib.sha256(t.encode('utf-8')).hexdigest()[:16]
              ok = (h == r['sha256'] and len(t) == r['자수'])
              print('%-16s %s' % (r['파일'], '일치' if ok else '★ 어긋남'))
              if not ok: bad.append(r['파일'])
          if bad:
              print('\n손으로 고친 파일이 있다: ' + ', '.join(bad))
              print('원본 코퍼스에서 다시 생성해 올릴 것.')
              sys.exit(1)
          print('\n샤드 %d개 모두 manifest 와 일치' % len(m['모델이_읽는_규칙']))
          PY

      - name: 표식(확인낱말·끝표식)이 샤드 밖으로 새지 않았는가
        run: |
          python3 - <<'PY'
          import json, io, os, re, sys
          m = json.load(io.open('manifest.json', encoding='utf-8'))
          shards = [r['파일'] for r in m['모델이_읽는_규칙']]
          words = {}      # (파일, 값) — 머리의 확인낱말과 끝의 끝표식 둘 다
          for f in shards:
              t = io.open(f, encoding='utf-8').read()
              h = re.search(r'^확인낱말:\s*(\S+)\s*$', t[:400], re.M)
              e = re.search(r'^끝표식:\s*(\S+)\s*$', t[-300:], re.M)
              if not h or not e:
                  print('%s 에 확인낱말 또는 끝표식 줄이 없다' % f); sys.exit(1)
              words.setdefault(f, []).extend([h.group(1), e.group(1)])
          flat = [w for v in words.values() for w in v]
          if len(set(flat)) != len(flat):
              print('표식 값이 겹친다 — 어느 샤드를 읽었는지 구별할 수 없다'); sys.exit(1)
          print('표식 %d개(샤드 %d개 × 머리·끝) 모두 다름' % (len(flat), len(words)))

          # 자기 샤드 말고 다른 공개 파일에 값이 들어 있으면 안 된다
          # 같은 샤드의 HTML 판은 자기 확인낱말을 가지고 있는 것이 정상이다
          own = {}
          for s in shards:
              own[s] = s
              own[s[:-3] + '.html'] = s
          files = [f for f in os.listdir('.')
                   if os.path.isfile(f) and f.rsplit('.', 1)[-1] in ('md', 'json', 'html')]
          leak = []
          for f in files:
              t = io.open(f, encoding='utf-8', errors='ignore').read()
              for s, vs in words.items():
                  if own.get(f) == s: continue
                  for w in vs:
                      if w in t: leak.append('%s 에 %s 의 표식(%s)' % (f, s, w))
          if leak:
              print('\n★ 확인낱말이 샤드 밖으로 샜다 — 모델이 파일을 읽지 않고도 답할 수 있다')
              for l in leak: print('   ' + l)
              sys.exit(1)
          print('표식이 자기 샤드(와 그 HTML 판) 안에만 있다 — 파일 %d개 검사' % len(files))
          PY
